worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/css application/javascript application/json image/svg+xml;
    client_max_body_size 2m;

    server {
        listen 8080;

        # Public backend API — same-origin, so the frontend build ships with
        # an empty API base URL and just calls /api/public/* directly.
        location /api/public/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin backend API. No auth layer in front of this yet — access
        # control is expected to come from the deployment's network policy /
        # ingress rules, not from this container. See deploy/README.md.
        location /api/admin/ {
            proxy_pass http://127.0.0.1:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin frontend — built with `--base=/admin/` so its own asset
        # references already point at /admin/assets/... A bare `/admin`
        # (no trailing slash) doesn't match the prefix location below, so
        # without this redirect it silently falls through to the public
        # frontend's location block instead of 404ing or erroring.
        location = /admin {
            return 301 /admin/;
        }

        location /admin/ {
            alias /var/www/admin/;
            try_files $uri $uri/ /admin/index.html;
        }

        # Public frontend (TanStack Router client-side routing — unknown
        # paths fall through to index.html).
        location / {
            root /var/www/public;
            try_files $uri $uri/ /index.html;
        }
    }
}
